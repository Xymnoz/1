<!DOCTYPE html>
<html lang="en">

<head>

<!-- OJO DERECHO -->

<ellipse

cy="190"

    </div>

</div>
    <!-- INTRO -->

    <section id="intro">

        <h1 id="nickname">
    Xymnoz
</h1>

<p id="typingText"></p>

<p id="location">

    <i class="fa-solid fa-location-dot"></i>

    Argentina •

    <span id="clock"></span>

</p>
        <button id="enterBtn">
            Click to Enter
        </button>

    </section>

    <!-- CONTENIDO -->

    <main id="main">

        <div class="card">

            <div class="avatar"></div>

            <h1>Xymnoz</h1>

            <p class="bio">
                Building the impossible.
            </p>

            <!-- SOCIAL SHOWCASE -->

            <a id="socialCard" href="#" target="_blank">

                <div class="socialIcon">

                    <i id="socialIcon" class="fa-brands fa-discord"></i>

                </div>

                <div class="socialInfo">

                    <span id="socialTitle">

                        Discord

                    </span>

                    <small id="socialSubtitle">

                        @Xymnoz

                    </small>

                </div>

            </a>

            <div class="progress">

                <div id="progressBar"></div>

            </div>

        </div>

    </main>

    <audio id="bgMusic" loop>

        <source src="music.mp3" type="audio/mpeg">

    </audio>

    <script src="script.js"></script>

</html>
