<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Xymnoz</title>

    <!-- Fuente -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>
<!-- DIGITAL NOISE ENGINE -->

<div id="binaryBackground"></div>
    <!-- INTRO -->

    <section id="intro">

        <h1 id="nickname">
    Xymnoz
</h1>

<p id="typingText"></p>

<p id="location">

    <i class="fa-solid fa-location-dot"></i>

    Argentina •

    <span id="clock"></span>

</p>
        <button id="enterBtn">
            Presiona acá, pibe
        </button>

    </section>

    <!-- CONTENIDO -->

    <main id="main">

        <div class="card">

            <div class="avatar">

    <img
        src="avatar.gif"
        alt="Avatar">

</div>

            <div class="nameContainer">

    <!-- Ecualizador izquierdo -->
    <div class="equalizer left">

        <div class="bar" id="bar0"></div>
        <div class="bar" id="bar1"></div>
        <div class="bar" id="bar2"></div>

    </div>

    <!-- Nombre -->
    <h1 id="mainNickname" class="audioName">

        <span>X</span>
        <span>y</span>
        <span>m</span>
        <span>n</span>
        <span>o</span>
        <span>z</span>

    </h1>

    <!-- Ecualizador derecho -->
    <div class="equalizer right">

        <div class="bar" id="bar3"></div>
        <div class="bar" id="bar4"></div>
        <div class="bar" id="bar5"></div>

    </div>

</div>
            <p class="bio">
    <span id="bioTyping"></span><span id="bioCursor">▌</span>
</p>
            </p>

            <!-- SOCIAL SHOWCASE -->

            <a id="socialCard" href="#" target="_blank">

                <div class="socialIcon">

                    <i id="socialIcon" class="fa-brands fa-discord"></i>

                </div>

                <div class="socialInfo">

                    <span id="socialTitle">

                        Discord

                    </span>

                    <small id="socialSubtitle">

                        @Xymnoz

                    </small>

                </div>

            </a>

            <div class="progress">

                <div id="progressBar"></div>

            </div>

        </div>

    </main>

    <audio id="bgMusic" loop>

        <source src="music.mp3" type="audio/mpeg">

    </audio>

    <script src="script.js"></script>

</body>

</html>
